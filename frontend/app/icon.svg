<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Sage green badge -->
  <rect width="48" height="48" rx="10" fill="#6B9B4F"/>

  <!-- Steam wisps -->
  <rect x="16" y="3" width="4" height="4" fill="#FFFBF0" opacity="0.85"/>
  <rect x="12" y="7" width="4" height="4" fill="#FFFBF0" opacity="0.85"/>
  <rect x="16" y="11" width="4" height="4" fill="#FFFBF0" opacity="0.85"/>
  <rect x="28" y="3" width="4" height="4" fill="#FFFBF0" opacity="0.85"/>
  <rect x="32" y="7" width="4" height="4" fill="#FFFBF0" opacity="0.85"/>
  <rect x="28" y="11" width="4" height="4" fill="#FFFBF0" opacity="0.85"/>

  <!-- Veggie bits peeking over the rim -->
  <rect x="16" y="19" width="4" height="4" fill="#D98E4A"/>
  <rect x="20" y="19" width="4" height="4" fill="#F2C14E"/>
  <rect x="28" y="19" width="4" height="4" fill="#C1443C"/>

  <!-- Pot handles -->
  <rect x="4" y="23" width="8" height="4" fill="#FFFBF0"/>
  <rect x="36" y="23" width="8" height="4" fill="#FFFBF0"/>

  <!-- Pot rim -->
